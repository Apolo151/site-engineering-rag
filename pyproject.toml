[project]
name = "site-engineering-rag"
version = "0.1.0"
description = "RAG assistant grounded in the Nokia 1830 PSS Product Information & Planning Guide"
requires-python = "==3.12.*"
dependencies = [
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "torch>=2.2",
    "openai>=1.30",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]
