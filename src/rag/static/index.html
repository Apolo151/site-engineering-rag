<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Site-Engineering RAG Assistant</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --ink: #1a1d21;
    --muted: #667085;
    --border: #e4e7ec;
    --accent: #2c5cc5;
    --accent-ink: #ffffff;
    --code-bg: #f2f4f7;
    --green-bg: #e7f6ec; --green-ink: #1b6b3a;
    --amber-bg: #fdf1dd; --amber-ink: #8a5a12;
    --grey-bg: #eef0f3; --grey-ink: #52606d;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d;
      --panel: #1e2127;
      --ink: #e7e9ec;
      --muted: #98a2b3;
      --border: #2c313a;
      --accent: #6f9bff;
      --accent-ink: #0d1017;
      --code-bg: #14161b;
      --green-bg: #16301f; --green-ink: #7ee2a8;
      --amber-bg: #33260f; --amber-ink: #f0c079;
      --grey-bg: #262b33; --grey-ink: #aab3c0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 28px 20px 80px; }
  header h1 { font-size: 21px; margin: 0 0 4px; }
  header p { margin: 0; color: var(--muted); font-size: 13.5px; }
  .pill {
    display: inline-block; margin-top: 10px; padding: 3px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600; background: var(--grey-bg); color: var(--grey-ink);
  }
  .pill.ok { background: var(--green-bg); color: var(--green-ink); }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; margin-top: 18px;
  }
  .samples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .chip {
    border: 1px solid var(--border); background: var(--panel); color: var(--ink);
    border-radius: 999px; padding: 6px 12px; font-size: 12.5px; cursor: pointer;
    text-align: left; max-width: 100%;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  textarea {
    width: 100%; min-height: 70px; resize: vertical; padding: 11px 12px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--panel);
    color: var(--ink); font: inherit;
  }
  .controls { display: flex; flex-wrap: wrap; gap: 18px 22px; align-items: center; margin-top: 12px; font-size: 13px; color: var(--muted); }
  .controls label { display: flex; align-items: center; gap: 8px; }
  .controls input[type=range] { accent-color: var(--accent); }
  select { font: inherit; padding: 4px 6px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--ink); }
  .row { display: flex; gap: 12px; align-items: center; margin-top: 12px; }
  button.ask {
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px;
    padding: 10px 20px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button.ask:disabled { opacity: .55; cursor: default; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge.answered { background: var(--green-bg); color: var(--green-ink); }
  .badge.prompt { background: var(--amber-bg); color: var(--amber-ink); }
  .badge.threshold { background: var(--grey-bg); color: var(--grey-ink); }
  .answer-text { white-space: pre-wrap; margin-top: 10px; font-size: 15px; }
  .meta { color: var(--muted); font-size: 12.5px; margin-top: 8px; }
  .note { color: var(--amber-ink); background: var(--amber-bg); padding: 8px 10px; border-radius: 8px; font-size: 12.5px; margin-top: 10px; }
  details { border-top: 1px solid var(--border); padding: 10px 0 2px; }
  details:first-of-type { border-top: 0; }
  summary { cursor: pointer; font-size: 13.5px; }
  .src-summary { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
  .score { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 600; }
  .path { color: var(--muted); font-size: 12px; margin: 6px 0; }
  .chunk-text, pre.prompt { white-space: pre-wrap; background: var(--code-bg); border-radius: 8px; padding: 10px; font-size: 12.5px; margin: 6px 0 2px; }
  pre.prompt { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; overflow-x: auto; }
  .spinner { width: 15px; height: 15px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; display: inline-block; animation: spin .7s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .err { color: #b42318; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Site-Engineering RAG Assistant</h1>
    <p>Grounded strictly in the Nokia 1830 PSS Product Information &amp; Planning Guide (R23.6), pp.&nbsp;47&ndash;166.</p>
    <span id="pill" class="pill">loading&hellip;</span>
  </header>

  <div class="samples" id="samples"></div>

  <div class="card">
    <textarea id="q" placeholder="Ask a site-engineering question about the 1830 PSS shelves&hellip;"></textarea>
    <div class="controls">
      <label>k <input type="range" id="k" min="1" max="10" value="5" /><span id="kval">5</span></label>
      <label>Shelf
        <select id="shelf"><option value="">All</option></select>
      </label>
      <label><input type="checkbox" id="nollm" /> Retrieval only</label>
    </div>
    <div class="row">
      <button class="ask" id="ask">Ask</button>
      <span id="status" class="meta"></span>
    </div>
  </div>

  <div id="result"></div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let CFG = { llm_configured: false };

function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

async function loadConfig() {
  try {
    CFG = await (await fetch("api/config")).json();
  } catch (e) {
    $("pill").textContent = "backend unreachable";
    return;
  }
  if (CFG.index_error) {
    $("pill").className = "pill";
    $("pill").textContent = "index error: " + CFG.index_error;
  } else if (CFG.llm_configured) {
    $("pill").className = "pill ok";
    $("pill").textContent = "LLM: " + CFG.model;
  } else {
    $("pill").className = "pill";
    $("pill").textContent = "Retrieval-only (no API key)";
    $("nollm").checked = true;
    $("nollm").disabled = true;
  }
  $("k").value = CFG.default_k || 5;
  $("kval").textContent = $("k").value;

  for (const s of CFG.shelves || []) {
    const o = document.createElement("option");
    o.value = o.textContent = s;
    $("shelf").appendChild(o);
  }
  for (const sq of CFG.sample_questions || []) {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = sq;
    b.onclick = () => { $("q").value = sq; ask(); };
    $("samples").appendChild(b);
  }
}

function badge(refused_by, answered) {
  if (refused_by === "threshold") return '<span class="badge threshold">abstained &middot; low similarity</span>';
  if (refused_by === "prompt") return '<span class="badge prompt">abstained &middot; not in context</span>';
  if (answered) return '<span class="badge answered">answered</span>';
  return '<span class="badge threshold">retrieval only</span>';
}

function render(d) {
  const answered = d.answer && d.refused_by !== "threshold";
  const parts = [];
  parts.push('<div class="card">');
  parts.push(badge(d.refused_by, answered));
  parts.push('<span class="meta"> &nbsp; top-1 similarity ' + d.top1_score.toFixed(3) + '</span>');
  if (d.note) parts.push('<div class="note">' + esc(d.note) + '</div>');
  if (d.answer) parts.push('<div class="answer-text">' + esc(d.answer) + '</div>');
  else parts.push('<div class="meta" style="margin-top:10px">No answer generated (retrieval only). See sources and the assembled prompt below.</div>');
  parts.push('</div>');

  parts.push('<div class="card">');
  parts.push('<div style="font-weight:600;margin-bottom:4px">Retrieved passages (' + d.retrieved.length + ')</div>');
  d.retrieved.forEach((r, i) => {
    const pg = r.page_start === r.page_end ? "p. " + r.page_start : "pp. " + r.page_start + "-" + r.page_end;
    parts.push('<details' + (i === 0 ? ' open' : '') + '>');
    parts.push('<summary><span class="src-summary"><span class="score">' + r.score.toFixed(3) + '</span>'
      + '<span>' + esc(r.section_number + " " + r.section_title) + '</span>'
      + '<span class="meta">&middot; ' + pg + (r.shelf ? " &middot; " + esc(r.shelf) : "") + '</span></span></summary>');
    parts.push('<div class="path">' + esc(r.section_path) + '</div>');
    parts.push('<div class="chunk-text">' + esc(r.text) + '</div>');
    parts.push('</details>');
  });
  parts.push('</div>');

  parts.push('<div class="card"><details><summary>Assembled prompt (user message sent to the model)</summary>'
    + '<pre class="prompt">' + esc(d.prompt) + '</pre></details></div>');

  $("result").innerHTML = parts.join("");
}

async function ask() {
  const question = $("q").value.trim();
  if (!question) { $("q").focus(); return; }
  $("ask").disabled = true;
  const started = Date.now();
  $("status").innerHTML = '<span class="spinner"></span> retrieving' + ($("nollm").checked ? "" : " &amp; generating") + '&hellip;';
  try {
    const res = await fetch("api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        question,
        k: parseInt($("k").value, 10),
        shelf_filter: $("shelf").value || null,
        call_llm: !$("nollm").checked,
      }),
    });
    const data = await res.json();
    if (!res.ok) {
      $("result").innerHTML = '<div class="card err">' + esc(data.error || ("HTTP " + res.status)) + '</div>';
    } else {
      render(data);
    }
    $("status").textContent = ((Date.now() - started) / 1000).toFixed(1) + " s";
  } catch (e) {
    $("result").innerHTML = '<div class="card err">' + esc(String(e)) + '</div>';
    $("status").textContent = "";
  } finally {
    $("ask").disabled = false;
  }
}

$("ask").onclick = ask;
$("k").oninput = () => ($("kval").textContent = $("k").value);
$("q").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); }
});
loadConfig();
</script>
</body>
</html>
